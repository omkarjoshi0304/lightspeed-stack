name: Lightspeed Core Service (LCS)
service:
  host: 0.0.0.0
  port: 8080
  base_url: http://localhost:8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  # Uses a remote llama-stack service
  # The instance would have already been started with a llama-stack-run.yaml file
  use_as_library_client: false
  # Alternative for "as library use"
  # use_as_library_client: true
  # library_client_config_path: <path-to-llama-stack-run.yaml-file>
  url: http://localhost:8321
  api_key: xyzzy
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"

# Conversation cache for storing Q&A history
conversation_cache:
  type: "sqlite"
  sqlite:
    db_path: "/tmp/data/conversation-cache.db"  # Persistent across requests, can be deleted between test runs

authentication:
  module: "noop"


# OKP Solr for supplementary RAG
solr:
  enabled: false
  offline: true

mcp_servers:
  - name: "rhos-mcps-openstack"
    provider_id: "model-context-protocol"
    url: "http://localhost:3000/openstack"


byok_rag:
  - rag_id: "vs_57fcd0f5-812b-4fd6-86d2-7e2ff013a360"
    rag_type: "inline::faiss"
    embedding_model: "sentence-transformers/all-mpnet-base-v2"
    embedding_dimension: 768
    vector_db_id: "vs_57fcd0f5-812b-4fd6-86d2-7e2ff013a360"
    db_path: "/Users/ojoshi/Documents/GitHub/rag-content/vector_db/faiss_store.db"